[package]
name = "twitch-ircv"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/MisterEggnog/twitch-ircv.git"
license = "GPL-3.0-only"
publish = false

[lints.clippy]
unwrap_used = "deny"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
function_name = "0.3.0"
tokio = { version = "1.48.0", features = ["full"] }
twitch-irc = "6.1.1"

[dev-dependencies]
iter-read = "1.1.0"
tempfile = "3.23.0"
